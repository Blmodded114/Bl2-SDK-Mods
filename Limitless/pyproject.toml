[project]
name = "Limitless"
version = "1.0"
authors = [{ name = "BlModded114" }]
description = """
You can customize how many points can go into skills, and how many skill points you gain per level.
The increased points going into skills also applies to Class Mods.
The possibilities are almost limitless

The settings are applied when you save quit and go back in game.
"""

[project.urls]
Homepage = "https://github.com/Blmodded114/Bl2-SDK-Mods"
Repository = "https://github.com/Blmodded114/Bl2-SDK-Mods.git"
"Bug Tracker" = "https://github.com/Blmodded114/Bl2-SDK-Mods/issues"

[tool.sdkmod]
name = "Limitless"
supported_games = ["BL2","TPS","AODK"]
download = "https://github.com/Blmodded114/Bl2-SDK-Mods/raw/refs/heads/main/LootMidgetWorld/LootMidgetWorld.sdkmod"
license = { name = "MIT", url = "https://choosealicense.com/licenses/mit/" }
